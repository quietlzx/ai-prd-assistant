[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-prd-assistant"
version = "0.2.0"
description = "面向 Codex 的分阶段 PRD 生成、AI 风险分析、人工审核和报告组装 Skill。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "quietlzx" }
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
